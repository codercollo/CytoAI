name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  WEB_IMAGE_NAME: ${{ github.repository }}-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      web_image: ${{ steps.tags.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          echo "api_image=${REGISTRY}/${API_IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${WEB_IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build + push API image (Go API + ML sidecar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.web
          push: true
          build-args: |
            NUXT_API_BASE=http://api:8080
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: API_IMAGE,WEB_IMAGE
          script: |
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}"
            export WEB_IMAGE="${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cd /opt/cytoai
            grep -q '^API_IMAGE=' .env 2>/dev/null && sed -i "s|^API_IMAGE=.*|API_IMAGE=$API_IMAGE|" .env || echo "API_IMAGE=$API_IMAGE" >> .env
            grep -q '^WEB_IMAGE=' .env 2>/dev/null && sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=$WEB_IMAGE|" .env || echo "WEB_IMAGE=$WEB_IMAGE" >> .env
            bash scripts/deploy_contabo.sh
