services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cytoai}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyto} -d ${POSTGRES_DB:-cytoai}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/db/migrations:/migrations:ro
    entrypoint: [ "migrate" ]
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-cyto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cytoai}?sslmode=disable"
      - "up"

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CYTOAI_POSTGRES_DSN: postgres://${POSTGRES_USER:-cyto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cytoai}?sslmode=disable
      CYTOAI_ML_BASE_URL: http://localhost:5001
      CYTOAI_HTTP_PORT: "8080"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_API_BASE: http://api:8080

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
